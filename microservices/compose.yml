services:
  iot-db:
    image: mariadb:12
    environment:
      MARIADB_DATABASE: iot
      MARIADB_USER: iot
      MARIADB_PASSWORD: iotpw
      MARIADB_ROOT_PASSWORD: iamroot
    volumes:
      - iot_mariadb_data:/var/lib/mysql
    ports:
      - "3307:3306"
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--su=mysql", "--connect", "--innodb_initialized"]
      timeout: 10s
      retries: 5

  reactive-db:
    image: mariadb:12
    environment:
      MARIADB_DATABASE: reactive
      MARIADB_USER: reactive
      MARIADB_PASSWORD: reactivepw
      MARIADB_ROOT_PASSWORD: iamroot
    volumes:
      - reactive_mariadb_data:/var/lib/mysql
    ports:
      - "3308:3306"
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--su=mysql", "--connect", "--innodb_initialized"]
      timeout: 10s
      retries: 5

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    ports:
      - "9001:8080"
    depends_on:
      kafka-0:
        condition: service_healthy
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka-0:9092
      KAFKA_CLUSTERS_0_METRICS_PORT: 9997
      DYNAMIC_CONFIG_ENABLED: "true"

  kafka-0:
    image: apache/kafka:4.1.1
    volumes:
      - kafka_0_data:/var/lib/kafka/data
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka-0:9092
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka-0:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_NUM_PARTITIONS: 3
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: true
      JMX_PORT: 9997
    ports:
      - "9092:9092"
    healthcheck:
      test: ["CMD-SHELL", "unset JMX_PORT && /opt/kafka/bin/kafka-topics.sh --list --bootstrap-server localhost:9092 || exit 1"]
      timeout: 10s
      retries: 5

  rates:
    build:
      context: ./rates
    ports:
      - "8082:8082"

  iot:
    build:
      context: ./iot
    ports:
      - "8080:8080"
    environment:
      MICRONAUT_SERVER_PORT: 8080
      DATASOURCES_IOT_URL: jdbc:mariadb://iot-db:3306/iot
      DATASOURCES_IOT_USERNAME: iot
      DATASOURCES_IOT_PASSWORD: iotpw
      KAFKA_BOOTSTRAP_SERVERS: kafka-0:9092
    depends_on:
      iot-db:
        condition: service_healthy
      kafka-0:
        condition: service_healthy

  reactive:
    build:
      context: ./reactive
    ports:
      - "8081:8081"
    environment:
      MICRONAUT_SERVER_PORT: 8081
      DATASOURCES_REACTIVE_URL: jdbc:mariadb://reactive-db:3306/reactive
      DATASOURCES_REACTIVE_USERNAME: reactive
      DATASOURCES_REACTIVE_PASSWORD: reactivepw
      MICRONAUT_HTTP_SERVICES_RATES_URL: http://rates:8082
      MICRONAUT_HTTP_SERVICES_RATES_PATH: /
      MICRONAUT_HTTP_SERVICES_IOT_URL: http://iot:8080
      KAFKA_BOOTSTRAP_SERVERS: kafka-0:9092
    depends_on:
      reactive-db:
        condition: service_healthy
      kafka-0:
        condition: service_healthy
      rates:
        condition: service_started
      iot:
        condition: service_started

volumes:
  iot_mariadb_data:
  reactive_mariadb_data:
  kafka_0_data: